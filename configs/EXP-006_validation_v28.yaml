  scene_root: tttLRM/data_example/nuscenes_exp006_all
  split: val
  image_height: 224
  image_width: 224

foundation:
  repository: FastVGGT
  checkpoint: FastVGGT/ckpt/model_tracker_fixed_e20.pt
  feature_dim: 2048

stage0:
  output_checkpoint: revisit3d/checkpoints/exp006_geometry_bootstrap_v22.pt
