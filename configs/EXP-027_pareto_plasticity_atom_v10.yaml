experiment: EXP-027
protocol_revision: v1.0
seed: 2700010
prior_stage: revisit3d/results/EXP-026/stage0_pareto_gradient_diagnosis_v10.json

data:
  manifest: revisit3d/manifests/exp009_geometry_pilot_train_v15.json
  geometry_cache: revisit3d/cache/EXP-009/locked_transfer_geometry_train_v15.pt
  scene_root: tttLRM/data_example/nuscenes_exp009_unseen
  nuscenes_root: /mnt/ssd/nuscenes
  split: train

model:
  feature_dim: 2048
  key_dim: 64
  code_dim: 8
  hidden_dim: 128
  visual_key: frozen_train_pca

method:
  online_loss: track3d_only
  step_size: 0.0125
  steps: 1
  transport: visual
  reuse_strength: 0.10

meta_objective:
  objectives: [aligned_absolute_log_depth, aligned_absolute_relative_depth]
  aggregation: objective_specific_current_and_best_candidate
  gradient_synthesis: arithmetic_mean_of_unit_gradients
  minimum_gradient_norm: 1.0e-12
  descent_tolerance: 1.0e-8
  minimum_depth: 1.0e-6

meta_candidates:
  count: 5
  foreign_count: 3

training:
  steps: 1000
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  log_every: 200

crossfit:
  folds: 5
  grouping: physical_overlap_component

lidar:
  minimum_depth_m: 1.0
  maximum_depth_m: 80.0
  minimum_cells_per_view: 8

statistics:
  bootstrap_samples: 10000
  bootstrap_seed: 2700010

success:
  minimum_targets: 200
  minimum_components: 20
  primary_metrics: [silog, abs_rel, point_epe_m]
  minimum_positive_current_intervals: 1
  minimum_positive_oracle_intervals: 1
  minimum_realized_common_descent_rate: 0.90
  require_current_all_metric_means_improve: true
  require_oracle_all_metric_means_improve: true
  require_oracle_risk_interval_over_random: true

output:
  checkpoint: revisit3d/checkpoints/exp027_pareto_plasticity_atom_v10.pt
  result: revisit3d/results/EXP-027/stage0_pareto_plasticity_atom_train_v10.json
