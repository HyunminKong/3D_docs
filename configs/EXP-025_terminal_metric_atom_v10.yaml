experiment: EXP-025
protocol_revision: v1.0
seed: 2500010
prior_stage: revisit3d/results/EXP-024/stage0_metric_aligned_atom_train_v10.json

data:
  manifest: revisit3d/manifests/exp009_geometry_pilot_train_v15.json
  geometry_cache: revisit3d/cache/EXP-009/locked_transfer_geometry_train_v15.pt
  scene_root: tttLRM/data_example/nuscenes_exp009_unseen
  nuscenes_root: /mnt/ssd/nuscenes
  split: train

model:
  feature_dim: 2048
  key_dim: 64
  code_dim: 8
  hidden_dim: 128
  visual_key: frozen_train_pca

method:
  online_loss: track3d_only
  step_size: 0.0125
  steps: 1
  transport: visual
  reuse_strength: 0.10

meta_objective:
  loss: equal_aligned_log_and_relative_depth
  aggregation: equal_mean_current_and_best_candidate
  log_relative_weight: 0.5
  absolute_relative_weight: 0.5
  minimum_depth: 0.000001

meta_candidates:
  count: 5
  foreign_count: 3

training:
  steps: 1000
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  log_every: 200

crossfit:
  folds: 5
  grouping: physical_overlap_component

lidar:
  minimum_depth_m: 1.0
  maximum_depth_m: 80.0
  minimum_cells_per_view: 8

statistics:
  bootstrap_samples: 10000
  bootstrap_seed: 2500010

success:
  minimum_targets: 200
  minimum_components: 20
  primary_metrics: [silog, abs_rel, point_epe_m]
  minimum_positive_current_intervals: 1
  minimum_positive_oracle_intervals: 1
  require_current_all_metric_means_improve: true
  require_oracle_all_metric_means_improve: true
  require_oracle_risk_interval_over_random: true

output:
  result_stage: terminal_metric_atom_crossfit
  checkpoint_stage: terminal_metric_atom
  checkpoint: revisit3d/checkpoints/exp025_terminal_metric_atom_v10.pt
  result: revisit3d/results/EXP-025/stage0_terminal_metric_atom_train_v10.json
